<script type="module">
// ============================================================================
// CROWD harness — a synthetic bowl (lower + upper deck arc behind home, outfield
// bleachers, rooftop decks / concourse + fan deck, a street with ballhawks) seen
// from the real batting camera, a crowd close-up and a sweeping crowd cam.
// Time is driven manually (SwiftShader is slow):
//   ?park=wrigley|rate &tod=day|dusk|night &q=high|medium|low &view=bat|close|sweep|high|lf

import * as THREE from 'three';

const Q = new URLSearchParams(location.search);
const park = Q.get('park') === 'rate' ? 'rate' : 'wrigley';
const tod = ['day', 'dusk', 'night'].includes(Q.get('tod')) ? Q.get('tod') : 'day';
const quality = ['high', 'medium', 'low'].includes(Q.get('q')) ? Q.get('q') : 'high';
const useAtlas = Q.get('atlas') !== '0';
const dens = Q.has('dens') ? +Q.get('dens') : 1;
const P = PARKS[park], D2R = Math.PI / 180;
const lerp = (a, b, t) => a + (b - a) * t;
const hud = document.getElementById('hud'); if (Q.get('hud') === '0') hud.style.display = 'none';

// ---------------- renderer (mirrors the game's tiers: high = MSAA RT + bloom) ----------------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: quality !== 'low', powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.setPixelRatio(quality === 'high' ? Math.min(devicePixelRatio, 2) : quality === 'medium' ? Math.min(devicePixelRatio, 1.5) : 1);
renderer.setSize(innerWidth, innerHeight, false);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1, 9000);
let composer = null;
if (quality === 'high' && Q.get('post') !== '0') {
  const pr = renderer.getPixelRatio();
  const rt = new THREE.WebGLRenderTarget(innerWidth * pr, innerHeight * pr, { type: THREE.HalfFloatType, samples: 4 });
  composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth * pr / 2, innerHeight * pr / 2), 0.34, 0.42, 0.86));
  composer.addPass(new OutputPass());
  composer.setPixelRatio(pr); composer.setSize(innerWidth, innerHeight);
}

// ---------------- look per time of day (the v1 park LOOK numbers) ----------------
const LOOKS = {
  day: { sky: ['#5f97d6', '#cfe2f2'], fog: '#c3d6ea', fogD: 0.00032, sun: [0.35, 0.85, 0.4], sunI: 2.4, hemi: 1.15, crowd: 1.0, crowdShade: 0.62, night: 0 },
  dusk: { sky: ['#2b3f73', '#f0a36a'], fog: '#caa08a', fogD: 0.00036, sun: [-0.6, 0.18, -0.5], sunI: 1.5, hemi: 0.75, crowd: 0.7, crowdShade: 0.48, night: 0.35 },
  night: { sky: ['#02040b', '#0d1830'], fog: '#0e1628', fogD: 0.00026, sun: [0.1, 0.9, 0.3], sunI: 1.5, hemi: 0.8, crowd: 0.56, crowdShade: 0.4, night: 1 },
};
const L = LOOKS[tod];
const REAL = Q.get('real') === '1';
if (!REAL) {
scene.fog = new THREE.FogExp2(L.fog, L.fogD);
{
  const m = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { a: { value: new THREE.Color(L.sky[0]) }, b: { value: new THREE.Color(L.sky[1]) } },
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 a,b; varying vec3 vP; void main(){ float h = clamp(normalize(vP).y*2.2, 0.0, 1.0); gl_FragColor = vec4(mix(b,a,pow(h,0.7)),1.0);\n#include <colorspace_fragment>\n}' });

}
const sun = new THREE.DirectionalLight(tod === 'night' ? '#e8efff' : tod === 'dusk' ? '#ffc08a' : '#fff4e2', L.sunI);
sun.position.set(L.sun[0] * 1000, L.sun[1] * 1000, L.sun[2] * 1000);
scene.add(sun);
scene.add(new THREE.HemisphereLight(tod === 'night' ? '#8aa0d0' : '#cfe2ff', tod === 'night' ? '#202a20' : '#4a5a3a', L.hemi));
}

// ---------------- assets shim (same surface as src/assets.js) ----------------
async function loadShim(keys) {

    try { const ex = await (await fetch(f)).json(); Object.assign(all, ex.images || ex || {}); } catch (e) { /* none */ }
  }
  await Promise.all(keys.map(async k => {
    const m = all[k]; if (!m || !m.src) return;
    if (k === 'crowd_atlas' && !useAtlas) return;
    const im = new Image(); im.src = '/assets/' + m.src;
    try { await im.decode(); imgs[k] = im; meta[k] = m; } catch (e) { /* missing */ }
  }));

    get: k => imgs[k] || null, meta: k => meta[k] || null, has: k => !!imgs[k],

}
const parkKeys = park === 'wrigley'
  ? [`sky_wrigley_${tod}`, 'tex_ivy', 'tex_brick', 'tex_crowd_north', 'wrigley_facades', 'wrigley_facades_win', 'wrigley_ivy', 'wrigley_ivy_n', 'wrigley_ivy_leaves', 'wrigley_juniper']
  : [`sky_rate_${tod}`, 'tex_crowd_south'];
const assets = await loadShim(['crowd_atlas', ...(REAL ? parkKeys : [])]);
let crowd = null, crowdObj = null, stadium = null, buildMs = 0;
if (REAL) {
  const t0r = performance.now();
  const mod = await import(`/src/parks/${park}.js`);
  const build = park === 'rate' ? mod.buildRateStadium : mod.buildWrigleyStadium;
  stadium = build(THREE, { parkId: park, timeOfDay: tod, weather: 'clear', wind: { mph: 10, dir: 20 }, assets, quality, assetBase: `/assets/parks/${park}/` });
  buildMs = performance.now() - t0r;
  stadium.attach(scene);
  stadium.setCrowd?.(0.35);
  crowd = stadium.crowd;
  scene.traverse(o => { if (!crowdObj && o.name === 'crowd' && o.isMesh) crowdObj = o; });
}
if (!REAL) {
// ---------------- field + structures (cheap Lambert geometry) ----------------
const mats = {};
const M = (hex) => mats[hex] || (mats[hex] = new THREE.MeshLambertMaterial({ color: hex, side: THREE.DoubleSide }));
const add = (geo, hex) => { const m = new THREE.Mesh(geo, M(hex)); scene.add(m); return m; };
const C = park === 'rate'
  ? { grass: '#3f7b36', dirt: '#9e5e3b', wall: '#1E3F2E', seat: '#21492F', riser: '#77766f', steel: '#151515', eye: '#2F5A2A', track: '#8C5A40', front: '#1E3F2E' }
  : { grass: '#3E7A33', dirt: '#A2643F', wall: '#3F6B2E', seat: '#1D4A33', riser: '#85827a', steel: '#2E5A43', eye: '#22362A', track: '#9A4636', front: '#8C3B2C' };
{ const g = new THREE.CircleGeometry(1400, 64); g.rotateX(-Math.PI / 2); add(g, C.grass); }
{ const g = new THREE.RingGeometry(0, 100, 24, 1, Math.PI * 0.25, Math.PI * 0.5); g.rotateX(-Math.PI / 2); g.translate(0, 0.05, 0); add(g, C.dirt); }

  const pos = [], idx = [], np = prof.length;
  for (let i = 0; i < path.length; i++) for (let j = 0; j < np; j++) { const [o, y] = prof[j]; pos.push(path[i][0] + normals[i][0] * o, y, path[i][1] + normals[i][1] * o); }

}
const look = { crowd: L.crowd, crowdShade: L.crowdShade, night: L.night, sun: L.sun };
crowd = createCrowd(THREE, { parkId: park, quality, look, assets });
const R = (() => { let s = 99; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

// ---- outfield: wall + bleachers on the surfaceHeight profile ----
const S = P.stands, eye = park === 'rate' ? 8 : 6.5;
function ofPath(s0, s1, step = 1) { const p = [], n = []; for (let s = s0; s <= s1 + 1e-6; s += step) { const r = fenceDistance(park, s), d = [Math.sin(s * D2R), -Math.cos(s * D2R)]; p.push([d[0] * r, d[1] * r]); n.push(d); } return { p, n }; }

  const all = ofPath(-45, 45, 1);
  ribbon(all.p, all.n, [[-8, 0.04], [0, 0.04]], C.track);
  ribbon(all.p, all.n, [[0, 0], [0, P.fenceH], [1.5, P.fenceH]], C.wall);
  const rowD = park === 'rate' ? 3.0 : 2.9, nRows = Math.floor((S.depth - 2) / rowD);
  for (const [s0, s1] of [[-45, -eye], [eye, 45]]) {

    const prof = [[1.5, P.fenceH]];
    for (let k = 0; k < nRows; k++) { const d0 = 1.5 + k * rowD, y = lerp(S.startH, S.topH, (d0 + rowD) / S.depth); prof.push([d0, y], [d0 + rowD, y]); }
    prof.push([S.depth, S.topH], [S.depth + 0.5, S.topH + 4]);
    ribbon(pp.p, pp.n, prof, C.riser);
    for (let k = 0; k < nRows; k++) {
      const d0 = 1.5 + k * rowD, y = lerp(S.startH, S.topH, (d0 + rowD) / S.depth);
      ribbon(pp.p, pp.n, [[d0 + rowD - 0.45, y], [d0 + rowD - 0.3, y + 1.2]], C.seat);
      for (let i = 0; i < pp.p.length - 1; i++) row(pp.p[i], pp.p[i + 1], pp.n[i], pp.n[i + 1], d0 + rowD * 0.5, y, { spacing: 1.75, kind: 0, fill: 0.96 });
    }
  }
  const ep = ofPath(-eye, eye, 1);
  ribbon(ep.p, ep.n, [[1.5, P.fenceH], [S.depth, S.topH * 0.9], [S.depth, 0]], C.eye);
  if (park === 'wrigley') { // scoreboard block
    const sp = ofPath(-5, 5, 1);
    ribbon(sp.p, sp.n, [[S.depth, S.topH], [S.depth, 87], [S.depth + 12, 87]], '#1F4A33');
  } else {
    const sp = ofPath(-8, 8, 1);
    ribbon(sp.p, sp.n, [[S.depth + 50, 50], [S.depth + 50, 110]], '#0d0d0d');
  }
}
// ---- beyond: Wrigley street + rooftops / Rate concourse + Fan Deck ----
if (park === 'wrigley') {
  { const pp = ofPath(-45, 45, 1); ribbon(pp.p, pp.n, [[S.depth, 0.06], [S.depth + P.street.width, 0.06]], '#4a4a4c'); }
  for (let i = 0; i < 38; i++) {       // Waveland ballhawks (+ a few on Sheffield)
    const s = i < 30 ? lerp(-38, -7, R()) : lerp(8, 40, R()), r = fenceDistance(park, s) + S.depth + 5 + R() * 30;
    crowd.addFan(Math.sin(s * D2R) * r, 0, -Math.cos(s * D2R) * r, { kind: 2 });
  }
  for (const [s0, s1] of P.rooftops.spray) {
    const pp = ofPath(s0, s1, 1), d0 = S.depth + P.street.width, h = P.rooftops.h;
    ribbon(pp.p, pp.n, [[d0, 0], [d0, h], [d0 + 40, h]], '#7A3B2A');
    for (let k = 0; k < 4; k++) {
      const dd = d0 + 5 + k * 4, y = h + k * 3.4;
      ribbon(pp.p, pp.n, [[dd - 2, y], [dd + 2, y], [dd + 2, y + 3.4]], '#2d2f33');
      for (let i = 0; i < pp.p.length - 1; i++) row(pp.p[i], pp.p[i + 1], pp.n[i], pp.n[i + 1], dd, y, { spacing: 2.1, kind: 2, fill: 0.85 });
    }
    ribbon(pp.p, pp.n, [[d0 + 1.5, h], [d0 + 1.5, h + 3.5]], '#1c1c1c');
  }
} else {
  const pp = ofPath(-44, 44, 1), d0 = S.depth;
  ribbon(pp.p, pp.n, [[d0, S.topH], [d0, P.street.h], [d0 + P.street.width, P.street.h]], '#6E6E68');
  for (const [s0, s1] of [[-44, -10], [10, 44]]) for (let i = 0; i < 110; i++) {
    const s = lerp(s0, s1, R()), r = fenceDistance(park, s) + d0 + 4 + R() * 16;
    crowd.addFan(Math.sin(s * D2R) * r, P.street.h, -Math.cos(s * D2R) * r, { kind: 2 });
  }
  const fd = P.fanDeck, fp = ofPath(fd.spray[0], fd.spray[1], 1);
  for (let lvl = 0; lvl < 2; lvl++) {
    const y = fd.h + lvl * 10, dd = fd.d[0] + lvl * 10;
    ribbon(fp.p, fp.n, [[dd - 6, y], [dd + 6, y]], '#555');
    for (let i = 0; i < fp.p.length - 1; i++) row(fp.p[i], fp.p[i + 1], fp.n[i], fp.n[i + 1], dd, y, { spacing: 2.3, kind: 2, fill: 0.8 });
  }
}
// ---- grandstand: lower + upper deck arc from pole to pole behind home ----
{
  const off = park === 'rate' ? 45 : 30, back = park === 'rate' ? 62 : 56;
  const lineP = (t, sgn) => [sgn * (0.7071 * t + 0.7071 * off), -0.7071 * t + 0.7071 * off];
  const pts = [];

  for (let a = aE + 6; a <= -aE - 6 + 1e-6; a += 6) { const r = back + (rE - back) * Math.pow(Math.abs(a) / Math.abs(aE), 2.5); pts.push([r * Math.sin(a * D2R), r * Math.cos(a * D2R)]); }
  for (let t = 78; t <= 340; t += 8) pts.push(lineP(t, 1));
  const nrm = pts.map((p, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    let tx = b[0] - a[0], tz = b[1] - a[1]; const l = Math.hypot(tx, tz) || 1; tx /= l; tz /= l;
    let nx = -tz, nz = tx; if (nx * p[0] + nz * (p[1] + 150) < 0) { nx = -nx; nz = -nz; }
    return [nx, nz];
  });

    ? [{ d0: 0, y0: 4, rows: 30, rowD: 3.0, rise: 1.15, shadeFrom: 21 }, { d0: 70, y0: 64, rows: 24, rowD: 2.8, rise: 1.95 }]
    : [{ d0: 0, y0: 3.5, rows: 28, rowD: 3.0, rise: 1.05, shadeFrom: 17 }, { d0: 56, y0: 44, rows: 20, rowD: 2.8, rise: 1.7 }];
  ribbon(pts, nrm, [[-1.5, 0], [-1.5, 3.2], [0, 3.2]], C.front);
  decks.forEach((dk, di) => {
    const prof = [];

const t0 = performance.now();
crowdObj = crowd.build();
buildMs = performance.now() - t0;
scene.add(crowdObj);
}   // !REAL

// ---------------- cameras ----------------
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  close() { const s = -22, r = fenceDistance(park, s); return { pos: [Math.sin((s + 4) * D2R) * (r - 40), 22, -Math.cos((s + 4) * D2R) * (r - 40)], look: [Math.sin(s * D2R) * (r + 24), 27, -Math.cos(s * D2R) * (r + 24)], fov: 32 }; },
  sweep() { return { pos: [150, 26, -150], look: [-40, 34, 40], fov: 52 }; },

  high() { return { pos: [0, 330, -620], look: [0, 0, -80], fov: 56 }; },

// ---------------- harness API ----------------
let simT = 0;

  ready: true,
};
window.H = H;
const inf = H.info();
hud.textContent = `${park} ${tod} ${quality}  fans ${inf.fans}  atlas ${inf.stats.atlas}  build ${inf.buildMs}ms`;
H.step(0.5); render();
if (Q.get('auto') === '1') { let last = performance.now(); const loop = () => { const n = performance.now(); crowd.update((n - last) / 1000, n / 1000); last = n; render(); requestAnimationFrame(loop); }; loop(); }
</script>
</body></html>
