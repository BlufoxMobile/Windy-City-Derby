<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rate Field harness</title>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:6px;top:6px;font:11px/1.3 ui-monospace,Menlo,monospace;color:#fff;background:rgba(0,0,0,.45);padding:4px 6px;border-radius:4px;white-space:pre;pointer-events:none;display:none}
</style></head><body><canvas id="gl"></canvas><div id="hud"></div>
<script type="module">
// Harness for src/parks/rate.js (RATE agent).
// ?tod=day|dusk|night &weather=clear|overcast|heat|drizzle &cam=bat|cf|board|high|lf|rf|deck|booth|lot|ryan|title|pen
// &q=high|medium|low &mph=12&dir=0 &noassets=1 &bats=R|L &hud=1 &live=1 &oop=1 (out-of-park spectacle) &cel=1
// window.__h: { rebuild(opts), cam(name|{pos,look,fov}), advance(sec,steps), stats(), S, ... }
import * as THREE from 'three';
import { createRenderer } from '/src/render.js';
import { buildRateStadium } from '/src/parks/rate.js';

const P = new URLSearchParams(location.search);
let tod = P.get('tod') || 'day', weather = P.get('weather') || 'clear', q = P.get('q') || 'high';
let camName = P.get('cam') || 'bat';
const wind = { mph: +(P.get('mph') ?? 12), dir: +(P.get('dir') ?? 20) };
const bats = P.get('bats') === 'L' ? 'L' : 'R';

// ---- Assets shim (get / meta / texture) over assets/manifest.json + scratch/rate/manifest-add.json
async function loadShim() {
  const imgs = {}, meta = {};
  if (P.get('noassets')) return mkAssets(imgs, meta);
  let man = { images: {} };
  try { man = await (await fetch('/assets/manifest.json')).json(); } catch (e) { console.warn('manifest failed', e); }
  try { const add = await (await fetch('/scratch/rate/manifest-add.json')).json(); Object.assign(man.images, add.images || add); } catch (e) { /* none yet */ }
  const keys = Object.keys(man.images).filter(k => /^sky_rate_|^tex_crowd_south$|^rate_/.test(k));
  await Promise.all(keys.map(async k => {
    const m = man.images[k]; const im = new Image(); im.src = '/assets/' + m.src;
    try { await im.decode(); imgs[k] = im; meta[k] = m; } catch (e) { console.info('asset missing', k); }
  }));
  return mkAssets(imgs, meta);
}
function mkAssets(imgs, meta) {
  return {
    get: k => imgs[k] || null, meta: k => meta[k] || null, has: k => !!imgs[k],
    texture(T, k, o = {}) { const im = imgs[k]; if (!im) return null; const t = new T.Texture(im); t.needsUpdate = true; t.colorSpace = o.srgb === false ? T.NoColorSpace : T.SRGBColorSpace; if (o.repeat) { t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(...o.repeat); } return t; },
    receipt: { loaded: Object.keys(imgs).length },
  };
}

const canvas = document.getElementById('gl');
const R = createRenderer(canvas, { quality: q, adaptive: false });
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 12000);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
// --- exact copy of src/camera.js fovFor + battingPose (no drift)
function fovFor(a) { const hMin = 30 * Math.PI / 180; const v = 2 * Math.atan(Math.tan(hMin / 2) / Math.max(a, 0.2)) * 180 / Math.PI; return clamp(Math.max(40, v), 40, 62); }
function battingPose(aspect) {
  const sgn = bats === 'L' ? 1 : -1, k = smooth(0.55, 1.7, aspect);
  return { pos: [sgn * lerp(3.4, 0.9, k), lerp(13.2, 10.2, k), lerp(18, 26, k)], look: [-sgn * lerp(0.9, 1.5, k), lerp(-8, 2.4, k), -60], fov: fovFor(aspect) };
}
const CAMS = {
  cf: a => ({ pos: [0, 70, -330], look: [0, 40, 60], fov: a < 1 ? 62 : 46 }),          // reverse angle from CF (grandstand + roof + skyline)
  cfhigh: a => ({ pos: [30, 150, -560], look: [0, 60, 40], fov: a < 1 ? 60 : 44 }),    // over the big board toward home
  board: a => ({ pos: [0, 40, -250], look: [0, 80, -470], fov: a < 1 ? 55 : 38 }),
  deck: a => ({ pos: [60, 30, -300], look: [0, 45, -450], fov: a < 1 ? 58 : 42 }),
  high: a => ({ pos: [320, 360, 300], look: [0, 0, -200], fov: a < 1 ? 60 : 44 }),
  title: a => ({ pos: [-150, 150, 160], look: [0, 30, -250], fov: a < 1 ? 62 : 44 }),
  lf: a => ({ pos: [-60, 30, -150], look: [-250, 30, -300], fov: a < 1 ? 60 : 46 }),
  rf: a => ({ pos: [60, 30, -150], look: [250, 30, -300], fov: a < 1 ? 60 : 46 }),
  booth: a => ({ pos: [0, 20, -80], look: [0, 78, 118], fov: a < 1 ? 55 : 40 }),
  gs: a => ({ pos: [120, 40, -200], look: [-120, 90, 80], fov: a < 1 ? 62 : 48 }),
  lot: a => ({ pos: [380, 60, -700], look: [120, 40, -380], fov: a < 1 ? 62 : 48 }),
  ryan: a => ({ pos: [-560, 120, -760], look: [-300, 20, -300], fov: a < 1 ? 62 : 48 }),
  pen: a => ({ pos: [120, 10, -300], look: [150, 10, -350], fov: a < 1 ? 58 : 44 }),
  outside: a => ({ pos: [900, 260, -900], look: [0, 40, -250], fov: a < 1 ? 60 : 44 }),
};
function setCam(name) {
  if (name && typeof name === 'object') { camera.position.set(...name.pos); camera.lookAt(...name.look); camera.fov = name.fov || 50; }
  else {
    camName = name || camName;
    const a = innerWidth / innerHeight;
    const c = camName === 'bat' ? battingPose(a) : (CAMS[camName] || CAMS.cf)(a);
    camera.position.set(...c.pos); camera.lookAt(...c.look); camera.fov = c.fov;
  }
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  return camera.fov;
}
setCam(camName);
R.resize(innerWidth, innerHeight);

const assets = await loadShim();
let S = null, T = 0, buildMs = 0;
function rebuild(o = {}) {
  tod = o.tod || tod; weather = o.weather || weather;
  if (o.q && o.q !== q) { q = o.q; R.setQuality(q); }
  if (S) { S.detach(scene); S.dispose(); }
  const t0 = performance.now();
  S = buildRateStadium(THREE, { parkId: 'rate', timeOfDay: tod, weather, wind: o.wind || wind, assets: o.noassets ? mkAssets({}, {}) : assets, quality: q });
  buildMs = Math.round(performance.now() - t0);
  S.attach(scene);
  S.setBoard({ name: P.get('name') || 'NOVA', homers: 7, outs: 3, score: 12450, lastFt: 452, message: P.get('msg') || 'NOW BATTING' });
  S.setCrowd(+(P.get('crowd') ?? 0.4));
  window.__h.S = S; window.__h.info = S.info(); window.__h.buildMs = buildMs;
  advance(0.5, 3);
  return { buildMs, info: S.info() };
}
function advance(sec = 0, steps = 1) { const dt = sec / Math.max(1, steps); for (let i = 0; i < steps; i++) { T += dt; S.update(dt, T); } render(); return T; }
function render() { R.render(scene, camera); }
function stats() {
  const r = R.renderer; r.info.autoReset = false; r.info.reset(); r.render(scene, camera);
  const o = { calls: r.info.render.calls, tris: r.info.render.triangles, geos: r.info.memory.geometries, texs: r.info.memory.textures, programs: r.info.programs?.length };
  r.info.autoReset = true; render(); return o;
}
function frameMs(n = 5) { const t0 = performance.now(); for (let i = 0; i < n; i++) { T += 1 / 60; S.update(1 / 60, T); R.render(scene, camera); } R.renderer.getContext().finish(); return (performance.now() - t0) / n; }
window.__h = { THREE, R, scene, camera, advance, render, stats, frameMs, setCam, cam: n => { setCam(n); render(); return camera.fov; }, rebuild };
rebuild({});
if (P.get('cel')) S.celebrate({ spray: +(P.get('spray') ?? -20), distance: 447, bonus: P.get('bonus') || null });
if (P.get('oop')) S.outOfPark({ spray: +(P.get('spray') ?? -20), distance: 512, landing: [-200, 0, -560], bonus: 'out_of_park' });
if (P.get('t')) advance(+P.get('t'), +(P.get('steps') ?? 8));
window.__ready = true;
console.log('[rate-harness] built', tod, weather, q, buildMs + 'ms', JSON.stringify(S.info()));
if (P.get('hud')) { const h = document.getElementById('hud'); h.style.display = 'block'; h.textContent = `rate ${tod} ${weather} ${q}\n` + JSON.stringify(stats()); }
if (P.get('live')) { let last = performance.now(); const loop = now => { requestAnimationFrame(loop); const dt = Math.min(0.05, (now - last) / 1000); last = now; R.beginFrame(dt); T += dt; S.update(dt, T); render(); }; requestAnimationFrame(loop); }
addEventListener('resize', () => { setCam(camName); R.resize(innerWidth, innerHeight); render(); });
</script></body></html>
