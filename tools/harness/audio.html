<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Derby Audio Board</title>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<style>
:root{--bg:#070b16;--panel:#0f1729;--line:#1f2b47;--ink:#e8eefc;--dim:#8b9bc0;--acc:#35d0ff;--hot:#ff7a1a;--ok:#7cff6b;--bad:#ff4b3a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:980px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:18px;letter-spacing:.08em;margin:0;font-weight:800}
h1 b{color:var(--acc)}
#status{color:var(--dim);font:12px/1.3 ui-monospace,Menlo,monospace}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin:10px 0}
section h2{margin:0 0 8px;font-size:11px;letter-spacing:.16em;color:var(--dim);font-weight:700;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
button{appearance:none;border:1px solid var(--line);background:#16213a;color:var(--ink);border-radius:9px;padding:10px 8px;font:600 12.5px/1.1 system-ui,sans-serif;cursor:pointer;touch-action:manipulation;min-height:40px}
button:hover{border-color:#34507f}button:active{transform:translateY(1px);background:#1d2b4b}
button.on{background:var(--acc);color:#04111c;border-color:var(--acc)}
button.big{background:linear-gradient(180deg,#ff8c33,#e2481f);border-color:#ff8c33;color:#fff}
button.warn{border-color:#5a2a2a}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}
.row label{display:flex;gap:6px;align-items:center;flex:1;min-width:220px;color:var(--dim);font-size:12px}
input[type=range]{flex:1;min-width:120px;accent-color:var(--acc)}
select{background:#16213a;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
#meters{display:grid;grid-template-columns:1fr;gap:8px}
canvas{width:100%;height:120px;background:#050812;border:1px solid var(--line);border-radius:8px;display:block}
.m{font:12px ui-monospace,Menlo,monospace;color:var(--dim)} .m b{color:var(--ink)}
#log{font:11.5px/1.4 ui-monospace,Menlo,monospace;color:var(--dim);white-space:pre-wrap;max-height:220px;overflow:auto}
</style></head>
<body><main>
<header><h1>WINDY CITY DERBY <b>AUDIO</b></h1><span id="status">locked — tap UNLOCK (or any button)</span></header>

<section><h2>Master</h2>
  <div class="row"><button id="unlock" class="big">UNLOCK</button><button id="mute">MUTE</button><button id="musicOn" class="on">MUSIC ON</button>
    <select id="park"><option value="wrigley">Wrigley Field</option><option value="rate">Rate Field</option></select></div>
  <div class="row"><label>crowd <b id="cv">0.35</b><input id="crowd" type="range" min="0" max="1" step="0.01" value="0.35"></label>
    <label>wind mph <b id="wv">12</b><input id="wind" type="range" min="0" max="25" step="1" value="12"></label></div>
</section>
<section><h2>Swing / pitch parameters</h2>
  <div class="row"><label>batSpeed <b id="bsv">0.72</b><input id="bs" type="range" min="0" max="1" step="0.01" value="0.72"></label>
    <label>quality <b id="qv">0.95</b><input id="q" type="range" min="0" max="1" step="0.01" value="0.95"></label></div>
  <div class="row"><label>pitch mph <b id="mv">94</b><input id="mph" type="range" min="70" max="102" step="1" value="94"></label>
    <label>contact <select id="contact"><option>sweet</option><option>solid</option><option>jammed</option><option>off the end</option><option>topped</option><option>under</option></select></label>
    <label>bats <select id="bats"><option>R</option><option>L</option></select></label></div>
</section>
<section><h2>Music cues</h2><div class="grid" id="cues"></div></section>
<section><h2>Organ riffs</h2><div class="grid" id="riffs"></div></section>
<section><h2>SFX (uses the parameters above)</h2><div class="grid" id="sfx"></div></section>
<section><h2>Scenarios</h2><div class="grid" id="scen"></div></section>
<section><h2>Voice clip (playClip → assets.buffer)</h2><div class="grid" id="clip"></div></section>
<section><h2>Output</h2><div id="meters"><canvas id="spec" width="900" height="120"></canvas><canvas id="scope" width="900" height="120"></canvas>
  <div class="m" id="lvl">peak — dBFS · rms — dBFS</div></div></section>
<section><h2>Log</h2><div id="log"></div></section>
</main>
<script type="module">
import { createAudio, SFX_NAMES, ORGAN_RIFFS, MUSIC_CUES, _data, _dsp } from '/src/audio.js';

const $ = id => document.getElementById(id);
const logEl = $('log');
const log = (...a) => { logEl.textContent = a.join(' ') + '\n' + logEl.textContent.slice(0, 4000); };
// ---- a fake Assets store: one synthesised "announcer" WAV (so the decode + duck path is exercised without files)
function wavBytes(chs, sr) {
  const n = chs[0].length, nc = chs.length, dv = new DataView(new ArrayBuffer(44 + n * 2 * nc));
  const w = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); dv.setUint32(4, 36 + n * 2 * nc, true); w(8, 'WAVE'); w(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, nc, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2 * nc, true); dv.setUint16(32, 2 * nc, true); dv.setUint16(34, 16, true); w(36, 'data'); dv.setUint32(40, n * 2 * nc, true);
  for (let i = 0; i < n; i++) for (let c = 0; c < nc; c++) dv.setInt16(44 + (i * nc + c) * 2, Math.max(-1, Math.min(1, chs[c][i])) * 32767, true);
  return dv.buffer;
}
let VO = null;
function voBytes() {
  if (VO) return VO;
  const r = _dsp.mulberry(77), sr = 22050, parts = [];
  for (let k = 0; k < 4; k++) { const u = _dsp.talkUtt(r, false, false); u.effort = 0.55; u.f0 = u.f0.map(([t, f]) => [t, f * 1.05]); parts.push(_dsp.genUtt(sr, u, r)); }
  const gap = Math.round(0.12 * sr), n = parts.reduce((a, p) => a + p.length + gap, 0), x = new Float32Array(n); let o = 0, pk = 0;
  for (const p of parts) { x.set(p, o); o += p.length + gap; } for (const v of x) pk = Math.max(pk, Math.abs(v)); for (let i = 0; i < n; i++) x[i] *= 0.7 / pk;
  return (VO = wavBytes([x], sr));
}
const fakeAssets = { buffer: k => (k === 'vo_test' ? voBytes().slice(0) : null), load: async () => true };

const audio = createAudio({ assets: fakeAssets, park: 'wrigley' });
window.audio = audio;
let analyser = null;
function ensure() {
  audio.unlock();
  if (!analyser && audio.context && audio._nodes.out) {
    analyser = audio.context.createAnalyser(); analyser.fftSize = 4096; analyser.smoothingTimeConstant = 0.6;
    audio._nodes.out.connect(analyser); requestAnimationFrame(draw);
  }
}
addEventListener('pointerdown', ensure, { capture: true, passive: true });
addEventListener('keydown', ensure, { capture: true });
const P = () => ({ batSpeed: +$('bs').value, quality: +$('q').value, contact: $('contact').value, mph: +$('mph').value, bats: $('bats').value, park: $('park').value });
const mk = (parent, label, fn, cls) => { const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls; b.onclick = () => { ensure(); fn(b); }; $(parent).appendChild(b); return b; };
$('unlock').onclick = () => { ensure(); log('unlock →', audio.state); };
$('mute').onclick = e => { audio.setMuted(!audio.muted); e.target.classList.toggle('on', audio.muted); e.target.textContent = audio.muted ? 'MUTED' : 'MUTE'; };
$('musicOn').onclick = e => { audio.setMusicOn(!audio.musicOn); e.target.classList.toggle('on', audio.musicOn); e.target.textContent = audio.musicOn ? 'MUSIC ON' : 'MUSIC OFF'; };
$('crowd').oninput = e => { audio.setCrowd(+e.target.value); $('cv').textContent = (+e.target.value).toFixed(2); };
$('wind').oninput = e => { $('wv').textContent = e.target.value; audio.setPark($('park').value, { wind: +e.target.value }); };
$('park').onchange = e => { audio.setPark(e.target.value, { wind: +$('wind').value }); log('park', e.target.value); };
for (const [id, out, f] of [['bs', 'bsv', 2], ['q', 'qv', 2], ['mph', 'mv', 0]]) $(id).oninput = e => { $(out).textContent = (+e.target.value).toFixed(f); };
audio.setCrowd(0.35);
MUSIC_CUES.forEach(c => mk('cues', c, () => { audio.music(c); log('music', c); }));
mk('cues', 'stop (null)', () => { audio.music(null); log('music null'); }, 'warn');
ORGAN_RIFFS.forEach(r => mk('riffs', r, () => { audio.organ(r); log('organ', r); }));
mk('riffs', 'stop (null)', () => audio.organ(null), 'warn');
const SFX_OPTS = { pitch_whoosh: p => ({ dur: 0.44 * 94 / p.mph, mph: p.mph }), crowd_ooh: () => ({ dur: 3.2, intensity: 0.9 }), crowd_roar: () => ({ distance: 440 }),
  wave_swell: () => ({ dur: 6, laps: 1, fromSpray: -20 }), out_of_park: p => ({ park: p.park, spray: -18, distance: 480 }), anticipation: () => ({ dur: 1.4 }), fireworks: () => ({ n: 5 }), streak: () => ({ n: 4 }) };
SFX_NAMES.forEach(n => mk('sfx', n, () => { const p = P(), o = { ...p, ...(SFX_OPTS[n] ? SFX_OPTS[n](p) : {}) }; audio.sfx(n, o); log('sfx', n, JSON.stringify(o)); }));
mk('sfx', 'streak n=5', () => audio.sfx('streak', { n: 5 }));
mk('sfx', 'countdown GO', () => audio.sfx('countdown', { final: true }));
mk('sfx', 'bell ×2', () => audio.sfx('ballpark_bell', { n: 2 }));
const later = (ms, f) => setTimeout(f, ms);
const atBat = (p, after) => { // windup → release → swing → contact (real game timings)
  audio.sfx('anticipation', { dur: 1.5 });
  later(1050, () => audio.sfx('pitch_whoosh', { dur: 0.44, mph: p.mph }));
  later(1050 + 440 - 110, () => audio.sfx('swing_whoosh', { batSpeed: p.batSpeed, leadT: 0.11, bats: p.bats }));
  later(1050 + 440, after);
};
mk('scen', 'HOMER (ooh→roar)', () => { const p = P(); atBat(p, () => {
  audio.sfx('bat_sweet', p); audio.setCrowd(0.6); audio.sfx('crowd_ooh', { dur: 2.2, intensity: 1 });
  later(2200, () => { audio.setCrowd(0.9); audio.sfx('crowd_roar', { distance: 430 }); audio.sfx('homer_horn'); audio.organ('homer'); if (p.park === 'rate') { audio.sfx('fireworks', { n: 10 }); audio.sfx('pinwheels'); } });
  later(7500, () => audio.setCrowd(0.35)); }); }, 'big');
mk('scen', 'OUT OF THE PARK', () => { const p = P(); atBat(p, () => {
  audio.sfx('bat_sweet', { ...p, batSpeed: 1, quality: 1 }); audio.setCrowd(0.6); audio.sfx('crowd_ooh', { dur: 2, intensity: 1 });
  later(2000, () => { audio.setCrowd(1); audio.sfx('crowd_roar', { distance: 480 }); audio.sfx('homer_horn'); });
  later(2900, () => { audio.sfx('out_of_park', { park: p.park, spray: -20, distance: 485 }); audio.organ('outOfPark'); });
  later(9000, () => audio.setCrowd(0.35)); }); }, 'big');
mk('scen', 'THE WAVE (3 straight)', () => { audio.setCrowd(0.5); audio.sfx('wave_swell', { dur: 6, fromSpray: -30 }); audio.organ('wave'); later(6500, () => audio.setCrowd(0.35)); }, 'big');
mk('scen', 'FLYOUT (ooh→aww)', () => { const p = P(); atBat(p, () => { audio.sfx('bat_solid', { ...p, quality: 0.7 }); audio.setCrowd(0.55); audio.sfx('crowd_ooh', { dur: 2.8, intensity: 0.8 });
  later(2500, () => { audio.sfx('crowd_groan'); audio.sfx('out'); audio.setCrowd(0.3); }); }); });
mk('scen', 'GROUNDER (jammed)', () => { const p = P(); atBat(p, () => { audio.sfx('bat_weak', { ...p, contact: 'jammed', quality: 0.3 }); later(1500, () => { audio.sfx('crowd_groan'); audio.sfx('out'); }); }); });
mk('scen', 'WHIFF', () => { const p = P(); atBat(p, () => { audio.sfx('whiff', p); later(40, () => audio.sfx('mitt', { mph: p.mph })); later(400, () => { audio.sfx('crowd_groan'); audio.sfx('out'); }); }); });
mk('scen', 'FOUL TIP', () => { const p = P(); atBat(p, () => { audio.sfx('foul', { ...p, quality: 0.2 }); later(60, () => audio.sfx('mitt', { mph: p.mph })); }); });
mk('scen', 'COUNTDOWN 3-2-1-GO', () => { [3, 2, 1].forEach((n, k) => later(k * 800, () => audio.sfx('countdown', { n }))); later(2400, () => audio.sfx('countdown', { final: true })); });
mk('scen', 'ROUND START', () => { audio.setCrowd(0.35); audio.music('batting'); audio.organ('walkup'); });
mk('clip', 'booth call (duck)', async () => { const r = await audio.playClip('vo_test', { gain: 1 }); log('playClip booth →', r ? r.duration.toFixed(2) + ' s' : 'null'); });
mk('clip', 'PA announcer', async () => { const r = await audio.playClip('vo_test', { fx: 'pa' }); log('playClip pa →', r ? r.duration.toFixed(2) + ' s' : 'null'); });
mk('clip', 'missing key', async () => { const r = await audio.playClip('nope'); log('playClip missing →', r); });

// ---------------------------------------------------------------- live meters
function draw() {
  requestAnimationFrame(draw);
  const S = audio._state, D = _data.DATA;
  $('status').textContent = `${audio.state} · ${audio.context ? audio.context.sampleRate + ' Hz' : ''} · park ${audio.park || '-'} · voices ${S.voices} · cue ${S.cue || '-'} · riff ${S.riff && !S.riff.stopped ? S.riff.name : '-'} · data ${Object.keys(D).length}/${Object.keys(_data.JOBS).length}`;
  if (!analyser) return;
  const f = new Float32Array(analyser.frequencyBinCount), w = new Float32Array(analyser.fftSize);
  analyser.getFloatFrequencyData(f); analyser.getFloatTimeDomainData(w);
  let pk = 0, ss = 0; for (const v of w) { pk = Math.max(pk, Math.abs(v)); ss += v * v; }
  $('lvl').innerHTML = `peak <b>${(20 * Math.log10(pk + 1e-9)).toFixed(1)}</b> dBFS · rms <b>${(10 * Math.log10(ss / w.length + 1e-12)).toFixed(1)}</b> dBFS`;
  const c = $('spec').getContext('2d'), Wd = c.canvas.width, H = c.canvas.height; c.clearRect(0, 0, Wd, H);
  const sr = audio.context.sampleRate; c.fillStyle = '#35d0ff';
  for (let x = 0; x < Wd; x++) { const fr = 30 * Math.pow(18000 / 30, x / Wd), bin = Math.min(f.length - 1, Math.round(fr / (sr / 2) * f.length)); const d = f[bin]; const h = Math.max(0, (d + 110) / 100) * H; c.fillRect(x, H - h, 1, h); }
  const s = $('scope').getContext('2d'); s.clearRect(0, 0, Wd, H); s.strokeStyle = '#ff7a1a'; s.beginPath();
  for (let x = 0; x < Wd; x++) { const v = w[Math.floor(x / Wd * w.length)]; s.lineTo(x, H / 2 - v * H / 2); } s.stroke();
}
requestAnimationFrame(draw);

// ============================================================================
// OFFLINE TEST SUITE — renders each cue through the REAL graph on an
// OfflineAudioContext (4 ch: 0-1 = final output, 2-3 = pre-safety-clip tap).
// window.AUDIO_TEST.renderCase(name, { wav:true }) → stats (+ base64 16-bit WAV)
// ============================================================================
const SR = 48000;
const DEF = { batSpeed: 0.72, quality: 0.95, mph: 94 };
const SFX_DUR = { bat_sweet: 2, bat_solid: 1.8, bat_weak: 1.6, foul: 1.4, whiff: 1.2, mitt: 1.4, pitch_whoosh: 1.2, homer_horn: 4, fireworks: 6, crowd_roar: 7, crowd_groan: 3.5,
  streak: 3, record: 3, out: 1.8, ui_tap: 0.5, ui_back: 0.5, ui_confirm: 0.8, countdown: 0.6, ding: 1.8, swing_whoosh: 0.9, wave_swell: 8, out_of_park: 9, pinwheels: 7.5,
  ballpark_bell: 5.5, crowd_ooh: 4.5, anticipation: 3, crowd_hey: 1.6, clap_chant: 8, whistle: 2, vendor: 2.5, el_train: 14, train_horn: 4, siren: 5.5, car_alarm: 3.5, car_horn: 1.5, ballhawks: 5, flag_snap: 3.5 };
const OPTS = { pitch_whoosh: { dur: 0.44, mph: 94 }, crowd_ooh: { dur: 3.5, intensity: 1 }, crowd_roar: { distance: 440 }, wave_swell: { dur: 6 }, out_of_park: { park: 'wrigley', spray: -18, distance: 480 },
  anticipation: { dur: 1.5 }, fireworks: { n: 5 }, streak: { n: 4 } };
const CASES = {};
SFX_NAMES.forEach(n => { CASES['sfx_' + n] = { dur: SFX_DUR[n] || 1.5, bed: false, park: /train_horn|siren|pinwheels|ballpark_bell/.test(n) ? 'rate' : 'wrigley', tl: [[0.05, A => A.sfx(n, { ...DEF, ...(OPTS[n] || {}) })]] }; });
// bat family across speed / contact
const BATV = { bat_sweet_slow: ['bat_sweet', { batSpeed: 0.25, quality: 0.95 }], bat_sweet_fast: ['bat_sweet', { batSpeed: 1, quality: 1 }], bat_solid_mid: ['bat_solid', { batSpeed: 0.7, quality: 0.7 }],
  bat_weak_jam: ['bat_weak', { batSpeed: 0.6, quality: 0.3, contact: 'jammed' }], bat_weak_end: ['bat_weak', { batSpeed: 0.6, quality: 0.3, contact: 'off the end' }],
  foul_tick: ['foul', { batSpeed: 0.7, quality: 0.2 }], foul_solid: ['foul', { batSpeed: 0.8, quality: 0.7 }], mitt_slow: ['mitt', { mph: 76 }], mitt_fast: ['mitt', { mph: 100 }],
  swing_slow: ['swing_whoosh', { batSpeed: 0.2 }], swing_fast: ['swing_whoosh', { batSpeed: 1 }], out_of_park_rate: ['out_of_park', { park: 'rate', spray: 5, distance: 500 }] };
for (const [k, [n, o]] of Object.entries(BATV)) CASES[k] = { dur: SFX_DUR[n] || 2, bed: false, park: o.park, tl: [[0.05, A => A.sfx(n, o)]] };
const RIFF_DUR = { charge: 5.5, walkup: 10, homer: 6.5, stretch: 21.5, tension: 16, wave: 9.5, outOfPark: 9 };
ORGAN_RIFFS.forEach(r => { CASES['organ_' + r] = { dur: RIFF_DUR[r], bed: false, tl: [[0.05, A => A.organ(r)]] }; });
CASES.music_title = { dur: 37, bed: false, tl: [[0.05, A => A.music('title')]] };
CASES.music_batting = { dur: 24, bed: false, tl: [[0.05, A => A.music('batting')]] };
CASES.music_roundOver = { dur: 6, bed: false, tl: [[0.05, A => A.music('roundOver')]] };
CASES.crowd_levels = { dur: 20, bed: true, park: 'wrigley', tl: [[0, A => A.setCrowd(0)], [5, A => A.setCrowd(0.35)], [10, A => A.setCrowd(0.7)], [15, A => A.setCrowd(1)]], windows: [[2, 4.9], [7, 9.9], [12, 14.9], [17, 19.9]] };
CASES.crowd_levels_rate = { ...CASES.crowd_levels, park: 'rate' };
CASES.crowd_between = { dur: 30, bed: true, park: 'wrigley', seed: 7, tl: [[0, A => A.setCrowd(0.4)]] }; // 30 s of between-pitch life: claps, whistles, shouts, vendors, chants
const flow = (park, oop) => ({ dur: oop ? 13 : 11, bed: true, park, tl: [
  [0, A => { A.setCrowd(0.35); A.music('batting'); }], [0.5, A => A.sfx('anticipation', { dur: 1.5 })], [1.55, A => A.sfx('pitch_whoosh', { dur: 0.44, mph: 95 })],
  [1.88, A => A.sfx('swing_whoosh', { batSpeed: 0.9, leadT: 0.11 })], [1.99, A => { A.sfx('bat_sweet', { batSpeed: 0.9, quality: 0.97 }); A.setCrowd(0.6); A.sfx('crowd_ooh', { dur: 2.2, intensity: 1 }); }],
  [4.2, A => { A.setCrowd(0.9); A.sfx('crowd_roar', { distance: oop ? 480 : 430 }); A.sfx('homer_horn'); if (!oop) A.organ('homer'); if (park === 'rate') A.sfx('fireworks', { n: 10 }); }],
  ...(oop ? [[5.0, A => { A.sfx('out_of_park', { park, spray: -18, distance: 480 }); A.organ('outOfPark'); }]] : []),
  [oop ? 11 : 9.5, A => A.setCrowd(0.35)]] });
CASES.flow_homer_wrigley = flow('wrigley', false);
CASES.flow_homer_rate = flow('rate', false);
CASES.flow_oop_wrigley = flow('wrigley', true);
CASES.flow_oop_rate = flow('rate', true);
CASES.flow_flyout = { dur: 7, bed: true, park: 'wrigley', tl: [[0, A => A.setCrowd(0.35)], [0.3, A => A.sfx('pitch_whoosh', { dur: 0.45 })], [0.64, A => A.sfx('swing_whoosh', { batSpeed: 0.7, leadT: 0.11 })],
  [0.75, A => { A.sfx('bat_solid', { batSpeed: 0.7, quality: 0.72 }); A.setCrowd(0.55); A.sfx('crowd_ooh', { dur: 2.8, intensity: 0.8 }); }], [3.4, A => { A.sfx('crowd_groan'); A.sfx('out'); A.setCrowd(0.3); }]] };
CASES.flow_wave = { dur: 9, bed: true, park: 'wrigley', tl: [[0, A => A.setCrowd(0.45)], [0.3, A => { A.sfx('wave_swell', { dur: 6, fromSpray: -30 }); A.organ('wave'); }], [7, A => A.setCrowd(0.35)]] };
CASES.flow_round = { dur: 30, bed: true, park: 'wrigley', tl: [ // a compressed real round, game.js call order
