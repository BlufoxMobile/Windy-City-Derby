<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Derby Audio Board</title>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<style>
:root{--bg:#070b16;--panel:#0f1729;--line:#1f2b47;--ink:#e8eefc;--dim:#8b9bc0;--acc:#35d0ff;--hot:#ff7a1a;--ok:#7cff6b;--bad:#ff4b3a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:980px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:18px;letter-spacing:.08em;margin:0;font-weight:800}
h1 b{color:var(--acc)}
#status{color:var(--dim);font:12px/1.3 ui-monospace,Menlo,monospace}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin:10px 0}
section h2{margin:0 0 8px;font-size:11px;letter-spacing:.16em;color:var(--dim);font-weight:700;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
button{appearance:none;border:1px solid var(--line);background:#16213a;color:var(--ink);border-radius:9px;padding:10px 8px;font:600 12.5px/1.1 system-ui,sans-serif;cursor:pointer;touch-action:manipulation;min-height:40px}
button:hover{border-color:#34507f}button:active{transform:translateY(1px);background:#1d2b4b}
button.on{background:var(--acc);color:#04111c;border-color:var(--acc)}
button.big{background:linear-gradient(180deg,#ff8c33,#e2481f);border-color:#ff8c33;color:#fff}
button.warn{border-color:#5a2a2a}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
#meters{display:grid;grid-template-columns:1fr;gap:8px}
canvas{width:100%;height:120px;background:#050812;border:1px solid var(--line);border-radius:8px;display:block}
.m{font:12px ui-monospace,Menlo,monospace;color:var(--dim)} .m b{color:var(--ink)}
#log{font:11.5px/1.4 ui-monospace,Menlo,monospace;color:var(--dim);white-space:pre-wrap;max-height:220px;overflow:auto}
</style></head>
<body><main>
<header><h1>WINDY CITY DERBY <b>AUDIO</b></h1><span id="status">locked — tap UNLOCK (or any button)</span></header>

<section><h2>Master</h2><div class="row">
  <button id="unlock" class="big">UNLOCK</button><button id="mute">MUTE</button><button id="musicOn" class="on">MUSIC ON</button>
  <span class="m">crowd <b id="cv">0.35</b></span><input id="crowd" type="range" min="0" max="1" step="0.01" value="0.35">
</div></section>

<section><h2>Music cues</h2><div class="grid" id="cues"></div></section>
<section><h2>Organ riffs</h2><div class="grid" id="riffs"></div></section>
<section><h2>SFX</h2><div class="grid" id="sfx"></div></section>
<section><h2>Scenarios</h2><div class="grid" id="scen"></div></section>
<section><h2>Output</h2><div id="meters"><canvas id="spec" width="900" height="120"></canvas><canvas id="scope" width="900" height="120"></canvas>
  <div class="m" id="lvl">peak — dBFS · rms — dBFS</div></div></section>
<section><h2>Log</h2><div id="log"></div></section>
</main>
<script type="module">

const $ = id => document.getElementById(id);
const logEl = $('log');
const log = (...a) => { logEl.textContent = a.join(' ') + '\n' + logEl.textContent.slice(0, 4000); };
const audio = createAudio();
window.audio = audio;

addEventListener('keydown', ensure, { capture: true });

$('crowd').oninput = e => { audio.setCrowd(+e.target.value); $('cv').textContent = (+e.target.value).toFixed(2); };
audio.setCrowd(0.35);
MUSIC_CUES.forEach(c => mk('cues', c, () => { audio.music(c); log('music', c); }));
mk('cues', 'stop (null)', () => { audio.music(null); log('music null'); }, 'warn');
ORGAN_RIFFS.forEach(r => mk('riffs', r, () => { audio.organ(r); log('organ', r); }));
mk('riffs', 'stop (null)', () => audio.organ(null), 'warn');
SFX_NAMES.forEach(n => mk('sfx', n, () => { audio.sfx(n); log('sfx', n); }));
mk('sfx', 'streak n=5', () => audio.sfx('streak', { n: 5 }));
mk('sfx', 'countdown GO', () => audio.sfx('countdown', { final: true }));

mk('scen', 'AT-BAT: HOMER', () => {
  audio.setCrowd(0.35); audio.sfx('pitch_whoosh');
  later(720, () => { audio.sfx('bat_sweet'); audio.setCrowd(0.8); audio.sfx('crowd_roar'); });
  later(3300, () => { audio.sfx('homer_horn'); audio.sfx('fireworks'); audio.organ('homer'); audio.sfx('streak', { n: 3 }); });
  later(7500, () => audio.setCrowd(0.35));
}, 'big');
mk('scen', 'AT-BAT: FLYOUT', () => { audio.sfx('pitch_whoosh'); later(720, () => { audio.sfx('bat_solid'); audio.setCrowd(0.55); }); later(2600, () => { audio.sfx('crowd_groan'); audio.sfx('out'); audio.setCrowd(0.3); }); });
mk('scen', 'AT-BAT: WHIFF', () => { audio.sfx('pitch_whoosh'); later(600, () => audio.sfx('whiff')); later(900, () => audio.sfx('mitt')); later(1200, () => { audio.sfx('crowd_groan'); audio.sfx('out'); }); });
mk('scen', 'AT-BAT: FOUL', () => { audio.sfx('pitch_whoosh'); later(720, () => audio.sfx('foul')); });
mk('scen', 'COUNTDOWN 3-2-1-GO', () => { [3, 2, 1].forEach((n, k) => later(k * 800, () => audio.sfx('countdown', { n }))); later(2400, () => audio.sfx('countdown', { final: true })); });
mk('scen', 'ROUND START', () => { audio.setCrowd(0.35); audio.music('batting'); audio.organ('walkup'); });

CASES.stress_homer = { dur: 9, bed: true, tl: [
  [0, A => { A.setCrowd(0.35); A.music('batting'); }], [0.5, A => A.sfx('pitch_whoosh')],
  [1.22, A => { A.sfx('bat_sweet'); A.setCrowd(0.8); A.sfx('crowd_roar'); }],
  [3.6, A => { A.sfx('homer_horn'); A.sfx('fireworks'); A.organ('homer'); A.sfx('streak', { n: 5 }); A.sfx('record'); A.sfx('ding'); }]] };

CASES.flow_round = { dur: 30, bed: true, tl: [ // a compressed real round, game.js call order
  [0, A => { A.setCrowd(0.35); A.music('batting'); A.organ('walkup'); }],
  [9, A => A.sfx('pitch_whoosh')], [9.72, A => { A.sfx('bat_solid'); A.setCrowd(0.55); }], [11.5, A => { A.sfx('crowd_groan'); A.sfx('out'); A.setCrowd(0.3); }],
  [13.5, A => A.organ('tension')], [15.5, A => A.sfx('pitch_whoosh')], [16.2, A => { A.sfx('bat_sweet'); A.setCrowd(0.8); A.sfx('crowd_roar'); }],
  [18.5, A => { A.sfx('homer_horn'); A.organ('homer'); A.setCrowd(0.35); }], [21.5, A => A.organ('tension')], [23, A => A.sfx('pitch_whoosh')],
  [23.6, A => A.sfx('whiff')], [23.9, A => { A.sfx('mitt'); A.sfx('crowd_groan'); A.sfx('out'); }], [25.5, A => { A.music('roundOver'); A.setCrowd(0.4); }]] };
const impulse = (A, node) => { const c = A.context, b = c.createBuffer(1, 64, c.sampleRate); b.getChannelData(0)[0] = 1; const s = c.createBufferSource(); s.buffer = b; s.connect(A._nodes[node]); s.start(A._state.vnow); };
CASES.probe_verb = { dur: 3.2, bed: false, tl: [[0.05, A => impulse(A, 'verbIn')]] };
CASES.probe_echo = { dur: 2.0, bed: false, tl: [[0.05, A => impulse(A, 'echoIn')]] };
CASES.probe_dry = { dur: 0.5, bed: false, tl: [[0.05, A => impulse(A, 'sfx')]] };
CASES.api_abuse = { dur: 6, bed: true, tl: [
  [0.05, A => { for (let k = 0; k < 10; k++) A.organ('tension'); for (let k = 0; k < 200; k++) A.sfx(SFX_NAMES[k % SFX_NAMES.length]); A.music('title'); A.music('title'); A.music('batting'); A.music('batting'); A.music(null); A.music('batting'); A.setCrowd(NaN); A.setCrowd(7); A.setCrowd(-3); A.sfx('nope'); A.organ('nope'); A.music('nope'); }],
  [1.0, A => { A.organ('tension'); A.organ('tension'); }], [2.0, A => { A.organ('homer'); A.organ('tension'); A.organ('tension'); }]] };
CASES.musicOff = { dur: 3, bed: false, tl: [[0, A => A.setMusicOn(false)], [0.05, A => { A.music('title'); A.organ('charge'); }]] };
CASES.muted = { dur: 2, bed: false, tl: [[0, A => A.setMuted(true)], [0.05, A => { A.music('title'); A.sfx('bat_sweet'); A.sfx('homer_horn'); }]] };
CASES.silentBeforeUnlock = { dur: 2, bed: true, noUnlock: true, tl: [[0.05, A => { A.music('title'); A.sfx('bat_sweet'); A.organ('charge'); }]] };

    for (let i = 0; i < n; i += len) { let cr = 1, ci = 0; for (let k = 0; k < len / 2; k++) {
      const ur = re[i + k], ui = im[i + k], vr = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci, vi = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
      re[i + k] = ur + vr; im[i + k] = ui + vi; re[i + k + len / 2] = ur - vr; im[i + k + len / 2] = ui - vi; const nr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = nr; } }
  }
}
const BANDS = [[20, 150], [150, 500], [500, 1500], [1500, 4000], [4000, 8000], [8000, 20000]];

}
const db = v => +(20 * Math.log10(v + 1e-12)).toFixed(2);

  let pk = 0, pre = 0, nan = 0, ss = 0, clip = 0, first = -1, last = -1; const thr = Math.pow(10, -50 / 20);
  const mono = new Float32Array(n);

  if (o.transient && first >= 0) { const sp = spectrum(mono, first, Math.min(n, first + Math.round(0.06 * sr)), sr); r.crack60ms = sp; }

async function renderCase(name, { wav = false } = {}) {

window.AUDIO_TEST = { CASES: Object.keys(CASES), renderCase };
